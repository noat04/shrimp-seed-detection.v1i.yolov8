<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="676" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">Cách mô hình học đếm tôm giống: mỗi vòng lặp huấn luyện</text><text x="500" y="56" text-anchor="middle" font-size="13" font-weight="400" fill="#555">Mô hình đoán, so với nhãn thật, rồi tự chỉnh trọng số để lần sau đoán sát hơn</text><rect x="40" y="84" width="200" height="192" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.6"/><circle cx="60" cy="106" r="12" fill="#3b82f6"/><text x="60" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="150.0" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Ảnh + nhãn thật</text><text x="140.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Nhãn: vị trí từng con</text><text x="140.0" y="254" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">(file .txt cùng tên ảnh)</text><rect x="60" y="124" width="160" height="70" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><ellipse cx="90" cy="146" rx="9" ry="3" fill="#475569" transform="rotate(-25 90 146)"/><ellipse cx="130" cy="164" rx="9" ry="3" fill="#475569" transform="rotate(-25 130 164)"/><ellipse cx="170" cy="148" rx="9" ry="3" fill="#475569" transform="rotate(-25 170 148)"/><ellipse cx="185" cy="176" rx="9" ry="3" fill="#475569" transform="rotate(-25 185 176)"/><ellipse cx="110" cy="180" rx="9" ry="3" fill="#475569" transform="rotate(-25 110 180)"/><rect x="77" y="137" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="117" y="155" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="157" y="139" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="172" y="167" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="97" y="171" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><text x="140" y="205" text-anchor="middle" font-size="11" font-weight="400" fill="#16a34a">khung xanh = nhãn thật</text><rect x="280" y="84" width="200" height="192" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.6"/><circle cx="300" cy="106" r="12" fill="#3b82f6"/><text x="300" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="390.0" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Tăng cường dữ liệu</text><text x="380.0" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Mosaic, lật ngang/dọc,</text><text x="380.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">đổi màu, phóng thu → ảnh</text><text x="380.0" y="254" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">mỗi epoch hơi khác nhau</text><g><rect x="310" y="128" width="30" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><rect x="346" y="128" width="30" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><rect x="382" y="128" width="30" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><rect x="418" y="128" width="30" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8"/></g><text x="380.0" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#2b2d42">batch = 8 ảnh</text><rect x="520" y="84" width="200" height="192" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.6"/><circle cx="540" cy="106" r="12" fill="#16a34a"/><text x="540" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="630.0" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Mạng YOLOv8</text><rect x="536" y="128" width="168" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="620" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2d42">Backbone</text><text x="620" y="155" text-anchor="middle" font-size="10.5" font-weight="400" fill="#2b2d42">trích đặc trưng</text><rect x="536" y="168" width="168" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="620" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2d42">Neck</text><text x="620" y="195" text-anchor="middle" font-size="10.5" font-weight="400" fill="#2b2d42">kết hợp nhiều tỷ lệ</text><rect x="536" y="208" width="168" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="620" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2d42">Head</text><text x="620" y="235" text-anchor="middle" font-size="10.5" font-weight="400" fill="#2b2d42">đoán box + độ tin cậy</text><rect x="760" y="84" width="200" height="192" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.6"/><circle cx="780" cy="106" r="12" fill="#16a34a"/><text x="780" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="870.0" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Dự đoán</text><text x="860.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Mạng đưa ra các box kèm</text><text x="860.0" y="254" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">xác suất là tôm</text><rect x="780" y="124" width="160" height="70" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><ellipse cx="810" cy="146" rx="9" ry="3" fill="#475569" transform="rotate(-25 810 146)"/><ellipse cx="850" cy="164" rx="9" ry="3" fill="#475569" transform="rotate(-25 850 164)"/><ellipse cx="890" cy="148" rx="9" ry="3" fill="#475569" transform="rotate(-25 890 148)"/><ellipse cx="905" cy="176" rx="9" ry="3" fill="#475569" transform="rotate(-25 905 176)"/><ellipse cx="830" cy="180" rx="9" ry="3" fill="#475569" transform="rotate(-25 830 180)"/><rect x="800" y="139" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6"/><rect x="840" y="157" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6"/><rect x="880" y="141" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6"/><rect x="895" y="169" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6"/><rect x="820" y="173" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6"/><text x="860" y="205" text-anchor="middle" font-size="11" font-weight="400" fill="#dc2626">khung đỏ = mô hình đoán</text><rect x="760" y="350" width="200" height="192" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.6"/><circle cx="780" cy="372" r="12" fill="#d97706"/><text x="780" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="870.0" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Tính loss</text><text x="860.0" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">So sánh đoán và nhãn thật:</text><text x="860.0" y="504" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">box lệch bao nhiêu, nhầm lớp,</text><text x="860.0" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">bỏ sót / dư; loss càng nhỏ càng tốt</text><rect x="780" y="390" width="160" height="70" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><ellipse cx="810" cy="412" rx="9" ry="3" fill="#475569" transform="rotate(-25 810 412)"/><ellipse cx="850" cy="430" rx="9" ry="3" fill="#475569" transform="rotate(-25 850 430)"/><ellipse cx="890" cy="414" rx="9" ry="3" fill="#475569" transform="rotate(-25 890 414)"/><ellipse cx="905" cy="442" rx="9" ry="3" fill="#475569" transform="rotate(-25 905 442)"/><ellipse cx="830" cy="446" rx="9" ry="3" fill="#475569" transform="rotate(-25 830 446)"/><rect x="797" y="403" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="837" y="421" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="877" y="405" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="892" y="433" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="817" y="437" width="26" height="18" fill="none" stroke="#16a34a" stroke-width="1.6"/><rect x="801" y="406" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="841" y="424" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="881" y="408" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="896" y="436" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="821" y="440" width="26" height="18" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="520" y="350" width="200" height="192" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.6"/><circle cx="540" cy="372" r="12" fill="#d97706"/><text x="540" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text><text x="630.0" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Cập nhật trọng số</text><text x="620.0" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Lan truyền ngược (backward):</text><text x="620.0" y="504" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">chỉnh ~3–11 triệu tham số</text><text x="620.0" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">để lần sau giảm loss</text><path d="M570,410 Q620,380 670,410" fill="none" stroke="#d97706" stroke-width="2"/><text x="620" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">w → w'</text><rect x="280" y="350" width="200" height="192" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><circle cx="300" cy="372" r="12" fill="#7c3aed"/><text x="300" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text><text x="390.0" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Validation</text><text x="380.0" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Chạy trên ảnh valid, KHÔNG</text><text x="380.0" y="504" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">cập nhật trọng số; đo Precision,</text><text x="380.0" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Recall, mAP50, mAP50–95</text><rect x="40" y="350" width="200" height="192" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><circle cx="60" cy="372" r="12" fill="#d97706"/><text x="60" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">8</text><text x="150.0" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Kết quả</text><text x="140.0" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">best.pt: epoch có điểm</text><text x="140.0" y="504" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">validation cao nhất</text><text x="140.0" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">last.pt: epoch cuối</text><line x1="240" y1="180.0" x2="280" y2="180.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="180.0" x2="520" y2="180.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="720" y1="180.0" x2="760" y2="180.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="860.0" y1="276" x2="860.0" y2="350" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="760" y1="446.0" x2="720" y2="446.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="620.0" y1="350" x2="620.0" y2="276" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/><text x="628.0" y="317.0" text-anchor="start" font-size="11" font-weight="600" fill="#d97706">trọng số mới cho batch kế tiếp</text><line x1="520" y1="446.0" x2="480" y2="446.0" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="446.0" x2="240" y2="446.0" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="438.0" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">hết epoch</text><rect x="40" y="560" width="920" height="96" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="500" y="584" text-anchor="middle" font-size="13" font-weight="700" fill="#14213d">Con số của bản đang chạy (train_yolo.py): 210 ảnh train, batch 8</text><text x="500" y="606" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">1 epoch = 210 ÷ 8 ≈ 27 lần cập nhật (bước 1 → 6);  30 epoch ≈ 810 lần cập nhật</text><text x="500" y="626" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Mỗi epoch kết thúc bằng 1 lần validation (bước 7); best.pt là bản tốt nhất trong 30 lần đó</text><text x="500" y="646" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2d42">Mô hình chỉ học từ ảnh train; ảnh valid chỉ để chọn checkpoint, ảnh test để đánh giá cuối</text></svg>