<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="750" fill="#ffffff"/><text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">Quy trình huấn luyện và triển khai mô hình đếm tôm giống</text><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><rect x="10" y="56" width="980" height="190" rx="14" fill="#dbeafe" opacity="0.5"/><text x="28" y="80" font-size="15" font-weight="700" fill="#14213d">1. Chuẩn bị dữ liệu</text><rect x="40" y="110" width="200" height="118" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="140.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Ảnh thực tế</text><text x="140.0" y="156" text-anchor="middle" font-size="12" fill="#2b2d42">Ảnh lớn, mật độ dày</text><text x="140.0" y="173" text-anchor="middle" font-size="12" fill="#2b2d42">(dataset_v2/pending</text><text x="140.0" y="190" text-anchor="middle" font-size="12" fill="#2b2d42">+ ảnh bổ sung)</text><rect x="280" y="110" width="200" height="118" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="380.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Duyệt nhãn thủ công</text><text x="380.0" y="156" text-anchor="middle" font-size="12" fill="#2b2d42">annotate.html</text><text x="380.0" y="173" text-anchor="middle" font-size="12" fill="#2b2d42">Sửa nhãn nháp, vẽ thêm,</text><text x="380.0" y="190" text-anchor="middle" font-size="12" fill="#2b2d42">xuất file YOLO .txt</text><rect x="520" y="110" width="200" height="118" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="620.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">make_tiles.py</text><text x="620.0" y="156" text-anchor="middle" font-size="12" fill="#2b2d42">Cắt ô 320px, chồng lấn 20%</text><text x="620.0" y="173" text-anchor="middle" font-size="12" fill="#2b2d42">Giữ box thấy ≥ 50%</text><text x="620.0" y="190" text-anchor="middle" font-size="12" fill="#2b2d42">Chia split theo ảnh nguồn</text><rect x="760" y="110" width="200" height="118" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="860.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Dataset mới</text><text x="860.0" y="156" text-anchor="middle" font-size="12" fill="#2b2d42">train / valid / test</text><text x="860.0" y="173" text-anchor="middle" font-size="12" fill="#2b2d42">images + labels</text><text x="860.0" y="190" text-anchor="middle" font-size="12" fill="#2b2d42">data.yaml (+ dữ liệu cũ)</text><line x1="240" y1="169.0" x2="280" y2="169.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="169.0" x2="520" y2="169.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="720" y1="169.0" x2="760" y2="169.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="262" width="980" height="190" rx="14" fill="#dcfce7" opacity="0.5"/><text x="28" y="286" font-size="15" font-weight="700" fill="#14213d">2. Huấn luyện (train_reviewed.py)</text><rect x="40" y="316" width="200" height="118" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="140.0" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Kiểm tra dữ liệu</text><text x="140.0" y="362" text-anchor="middle" font-size="12" fill="#2b2d42">validate(): nhãn hợp lệ,</text><text x="140.0" y="379" text-anchor="middle" font-size="12" fill="#2b2d42">không trùng ảnh giữa split,</text><text x="140.0" y="396" text-anchor="middle" font-size="12" fill="#2b2d42">mỗi split có box</text><rect x="280" y="316" width="200" height="118" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="380.0" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Nạp mô hình</text><text x="380.0" y="362" text-anchor="middle" font-size="12" fill="#2b2d42">yolov8s.pt (tiền huấn luyện)</text><text x="380.0" y="379" text-anchor="middle" font-size="12" fill="#2b2d42">Đổi đầu ra thành 1 lớp</text><text x="380.0" y="396" text-anchor="middle" font-size="12" fill="#2b2d42">shrimp-seed</text><rect x="520" y="316" width="200" height="118" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="620.0" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Lặp mỗi epoch ×100</text><text x="620.0" y="362" text-anchor="middle" font-size="12" fill="#2b2d42">Batch 8 → augment (mosaic,</text><text x="620.0" y="379" text-anchor="middle" font-size="12" fill="#2b2d42">lật, màu) → dự đoán → loss</text><text x="620.0" y="396" text-anchor="middle" font-size="12" fill="#2b2d42">→ cập nhật → validate → lưu</text><rect x="760" y="316" width="200" height="118" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="860.0" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Đầu ra huấn luyện</text><text x="860.0" y="362" text-anchor="middle" font-size="12" fill="#2b2d42">weights/best.pt, last.pt</text><text x="860.0" y="379" text-anchor="middle" font-size="12" fill="#2b2d42">results.csv, results.png</text><text x="860.0" y="396" text-anchor="middle" font-size="12" fill="#2b2d42">đường cong PR, ma trận nhầm</text><line x1="240" y1="375.0" x2="280" y2="375.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="375.0" x2="520" y2="375.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="720" y1="375.0" x2="760" y2="375.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M690,316 C690,290 550,290 550,316" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/><path d="M860.0,228 L860.0,254 L140.0,254 L140.0,312" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="468" width="980" height="190" rx="14" fill="#fce7f3" opacity="0.5"/><text x="28" y="492" font-size="15" font-weight="700" fill="#14213d">3. Đánh giá và triển khai</text><rect x="40" y="522" width="200" height="118" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/><text x="140.0" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Đánh giá số đếm</text><text x="140.0" y="568" text-anchor="middle" font-size="12" fill="#2b2d42">evaluate_counting.py</text><text x="140.0" y="585" text-anchor="middle" font-size="12" fill="#2b2d42">MAE / bias trên ảnh có</text><text x="140.0" y="602" text-anchor="middle" font-size="12" fill="#2b2d42">số đếm tay (ảnh dày)</text><rect x="280" y="522" width="200" height="118" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/><text x="380.0" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Chọn mô hình</text><text x="380.0" y="568" text-anchor="middle" font-size="12" fill="#2b2d42">So với best.pt hiện tại</text><text x="380.0" y="585" text-anchor="middle" font-size="12" fill="#2b2d42">Tốt hơn → đặt MODEL_PATH</text><text x="380.0" y="602" text-anchor="middle" font-size="12" fill="#2b2d42">rồi khởi động lại service</text><rect x="520" y="522" width="200" height="118" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/><text x="620.0" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">AI service /predict</text><text x="620.0" y="568" text-anchor="middle" font-size="12" fill="#2b2d42">Tùy chọn tile_size, conf,</text><text x="620.0" y="585" text-anchor="middle" font-size="12" fill="#2b2d42">Chạy YOLO theo ô → gộp box</text><text x="620.0" y="602" text-anchor="middle" font-size="12" fill="#2b2d42">trùng (NMS) → count</text><rect x="760" y="522" width="200" height="118" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="860.0" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">Kết quả trả về</text><text x="860.0" y="568" text-anchor="middle" font-size="12" fill="#2b2d42">JSON: count, detections</text><text x="860.0" y="585" text-anchor="middle" font-size="12" fill="#2b2d42">Ảnh gốc + ảnh có box</text><text x="860.0" y="602" text-anchor="middle" font-size="12" fill="#2b2d42">lưu Cloudinary → ChillShrimp</text><line x1="240" y1="581.0" x2="280" y2="581.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="581.0" x2="520" y2="581.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="720" y1="581.0" x2="760" y2="581.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M860.0,434 L860.0,460 L140.0,460 L140.0,518" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="680" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="64" y="693" font-size="12" fill="#2b2d42">Dữ liệu / sản phẩm đầu ra</text><rect x="260" y="680" width="16" height="16" rx="3" fill="#ffffff" stroke="#555"/><text x="284" y="693" font-size="12" fill="#2b2d42">Bước xử lý</text><text x="40" y="722" font-size="12" fill="#555">Lưu ý: model đang chạy (shrimp_seed_yolov8n) chỉ được train trên 300 ảnh gốc (khoảng 7,8 box/ảnh), chưa có ảnh dày.</text></svg>